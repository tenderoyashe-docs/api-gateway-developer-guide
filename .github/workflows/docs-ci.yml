name: docs-ci
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate spec, unit tests and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate OpenAPI contract
        run: |
          pip install openapi-spec-validator
          openapi-spec-validator openapi.yaml
      - name: Run upstream unit tests
        run: python -m unittest discover -s tests -v
      - name: Check internal Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './**/*.md'
          fail: true

  gateway-smoke-test:
    name: Gateway smoke test (Kong + Docker Compose)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Start gateway and upstream API
        run: docker compose up -d --build
      - name: Wait until the gateway can reach the upstream API
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'apikey: demo-local-only' \
              http://localhost:8000/inventory/health || true)
            if [ "$status" = "200" ]; then
              echo "Gateway ready after $attempt attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "Gateway did not become ready in time" >&2
          exit 1
      - name: Run smoke tests
        run: bash scripts/smoke-test.sh
      - name: Record versions for the verification log
        if: always()
        run: |
          docker --version
          docker compose version
          docker compose exec -T gateway kong version || true
      - name: Show container logs
        if: always()
        run: docker compose logs
      - name: Stop services
        if: always()
        run: docker compose down
